# 🐘 Добавка: если сервису нужна БД — вставь блок db в services: и depends_on в app
services:
  app:
    depends_on: [db]
    environment: { DATABASE_URL: "postgres://ctf:ctf@db:5432/ctf" }
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ctf, POSTGRES_PASSWORD: ctf, POSTGRES_DB: ctf }
    volumes: ["./pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
